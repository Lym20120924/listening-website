<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎧 初中英语听力小站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <h1>🎧 初中英语听力小站</h1>
        <p>💡 上传 MP3，随时随地练听力！✨</p>
    </header>

    <section class="upload-card">
        <h2>📤 添加新音频</h2>
        <div class="upload-box" id="uploadBox">
            <p>👉 点击或拖拽 MP3 文件到这里</p>
            <input type="file" id="audioFile" accept="audio/*" multiple hidden>
        </div>
        <div class="hint">💡 支持 MP3、WAV、M4A 等格式，上传后自动保存到浏览器～</div>
    </section>

    <section class="list-card">
        <h2>📚 我的听力库</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜索音频标题...">
        </div>
        <div id="audioList" class="audio-grid"></div>
        <div id="emptyState" class="empty-state" style="display:none;">
            <p>😴 暂时没有音频哦，快去上传一些吧！🎵</p>
        </div>
    </section>

    <section class="player-card">
        <h2>🎵 当前播放</h2>
        <div class="player">
            <audio id="mainAudio" controls preload="metadata"></audio>
            <div class="player-info">
                <div id="currentTitle">🎵 选择一个音频开始聆听～</div>
                <div class="progress-wrap"><div id="progressBar"></div></div>
                <div class="time-wrap"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>💖 用 ❤️ 做的听力小站 | 上传的音频仅保存在你的浏览器里～</p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
